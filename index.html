    <script>
      // AI Studio iFrame: HMR is disabled in this environment.
      // Intercept vite-hmr WebSocket connections to prevent 'WebSocket closed without opened' errors.
      (function() {
        if (typeof window === 'undefined') return;
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const isViteHmr = protocols === 'vite-hmr' || urlStr.includes('vite') || urlStr.includes('token=');
            if (isViteHmr) {
              const fakeWs = {
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') {
                    setTimeout(listener, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              return fakeWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress any stray WebSocket or Vite client errors
        window.addEventListener('error', function(event) {
          const msg = (event && (event.message || '')) + '';
          const filename = (event && (event.filename || '')) + '';
          if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || filename.includes('@vite/client')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reasonMsg = (event && event.reason && (event.reason.message || String(event.reason))) + '';
          if (reasonMsg.includes('WebSocket') || reasonMsg.includes('createWebSocketModuleRunnerTransport')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
